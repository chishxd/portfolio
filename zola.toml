# The URL the site will be built for
base_url = "https://chish.is-a.dev"

# Site title and description
title = "Chish"
description = "Chish's blog, guides, and devlogs"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Generate RSS feed
generate_feeds = true
feed_filenames = ["rss.xml"]
feed_limit = 20

# Entries in content/random/ are grouped by tag rather than by folder, so
# nothing has to be moved when the categories change. Zola generates a page
# per tag on its own; taxonomy_root puts them under /random/tags/ instead
# of the default top-level /tags/.
taxonomies = [{ name = "tags" }]
taxonomy_root = "random"

[markdown]
insert_anchor_links = "left"

[markdown.highlighting]
# Matches the site's dark background. The "css" option would emit
# class-based markup for styles.css to colour instead.
theme = "github-dark"

[extra]
# Put your custom variables here
socials = [
  { name = "GitHub", url = "https://github.com/chishxd", icon = "github.svg" },
  { name = "Codeberg", url = "https://codeberg.org/chish", icon = "codeberg.svg" },
  { name = "Bluesky", url = "https://bsky.app/profile/your-handle", icon = "bluesky.svg" },
  { name = "Discord", url = "https://discord.com/users/your-id", icon = "discord.svg" },
]
