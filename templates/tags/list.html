{% extends "base.html" %}

{% block content %}
<h1>Tags</h1>

{% if terms %}
<ul>
  {% for term in terms %}
  <li>
    <a href="{{ term.permalink }}">{{ term.name }}</a>
    <small>{{ term.page_count }}</small>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>No tags yet.</p>
{% endif %}
{% endblock content %}
