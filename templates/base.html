<!DOCTYPE html>
<html lang="en"{% block html_attrs %}{% endblock html_attrs %}>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Chish{% endblock title %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ get_url(path='styles.css') }}">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ get_url(path='rss.xml', trailing_slash=false) }}">
  <link rel="icon" type="image/png" href="{{ get_url(path='sans.png') }}">
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">

  <!-- Social / Discord Embeds -->
  <meta property="og:title" content="{% block og_title %}{{ config.title | default(value='Chish') }}{% endblock og_title %}">
  <meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock og_description %}">
  <meta property="og:type" content="{% block og_type %}website{% endblock og_type %}">
  <meta property="og:url" content="{{ current_url | default(value=config.base_url) | safe }}">
  <meta property="og:image" content="{{ get_url(path='sans.jpg') }}">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#d8a657">
</head>
<body{% block body_attrs %}{% endblock body_attrs %}>
  <nav>
    <a href="{{ get_url(path='@/_index.md') }}">Chish</a>
    <div>
      <a href="{{ get_url(path='@/blog/_index.md') }}">Blog</a>
      <a href="{{ get_url(path='@/devlogs/_index.md') }}">Devlogs</a>
      <a href="{{ get_url(path='rss.xml') }}">RSS</a>
    </div>
  </nav>

  <main>
    {% block parent %}{% endblock parent %}
    {% block content %}{% endblock content %}
  </main>
<footer>
  {% for s in config.extra.socials %}
  <a rel="me" href="{{ s.url }}">{{s.name}}</a>
  {% endfor %}
</footer>
</body>
</html>
