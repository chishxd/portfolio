<!DOCTYPE html>
<html lang="en"{% block html_attrs %}{% endblock html_attrs %}>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Chish{% endblock title %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ get_url(path='styles.css') }}">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ get_url(path='rss.xml', trailing_slash=false) }}">
</head>
<body{% block body_attrs %}{% endblock body_attrs %}>
  <nav>
    <a href="{{ get_url(path='@/_index.md') }}">Chish</a>
    <div>
      <a href="{{ get_url(path='@/blog/_index.md') }}">Blog</a>
      <a href="{{ get_url(path='@/devlogs/_index.md') }}">Devlogs</a>
      <a href="{{ get_url(path='rss.xml') }}">RSS</a>
    </div>
  </nav>

  <main>
    {% block parent %}{% endblock parent %}
    {% block content %}{% endblock content %}
  </main>
</body>
</html>
