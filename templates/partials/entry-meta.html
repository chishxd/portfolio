<!-- partials/entry-meta.html -->
{% if page.date %}
<p><small><time class="dt-published" datetime="{{ page.date }}">{{ page.date | date(format="%Y-%m-%d") }}</time></small></p>
{% endif %}

{% if page.taxonomies.tags %}
<p>
  {% for tag in page.taxonomies.tags %}
  <a class="p-category" href="{{ get_taxonomy_url(kind='tags', name=tag) }}">{{ tag }}</a>{% if not loop.last %}, {% endif %}
  {% endfor %}
</p>
{% endif %}
